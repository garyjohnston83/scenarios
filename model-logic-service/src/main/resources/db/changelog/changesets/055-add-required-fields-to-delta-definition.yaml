databaseChangeLog:
  - changeSet:
      id: 055-add-required-fields-to-delta-definition
      author: scenarios-team
      comment: "Add missing required top-level fields (schema_version, template_key, scenario_type, display_name) to the MARKET_DATA DELTA_BY_UNIQUE_ID definition so it passes backend validation on save"
      changes:
        - sql:
            sql: |
              UPDATE change_view_definition
              SET definition = '{"schema_version":"1.0","template_key":"market_data_delta_by_unique_id","scenario_type":"MARKET_DATA","display_name":"Market Data Delta By Unique ID","renderMode":"DELTA_BY_UNIQUE_ID","dataTypes":[{"dataTypeId":"timeSeriesValues","dataTypeTitle":"Time-Series Values","headerSummaryTextTemplate":"${changedValuesCount} Time-series Points have been changed for ${changedEntitiesCount} Time-Series","groupByEntityIdColumn":true,"columnDefinitions":[{"dataAttribute":"tsName","type":"string","display":"Time-Series Name","isEntityId":true},{"dataAttribute":"date","type":"date","display":"Date"},{"dataAttribute":"cur","type":"number","display":"Current Value"},{"dataAttribute":"new","type":"number","display":"New Value"}],"sortOrdering":{"dataAttribute":"tsName","direction":"ASC"},"rowThreshold":50,"overflowMessage":"Too many time-series value changes to display inline. Please use the external link to view all changes."},{"dataTypeId":"timeSeriesMetaData","dataTypeTitle":"Time-Series Meta-Data","headerSummaryTextTemplate":"${changedValuesCount} Time-Series Meta-Data attribute have been changed for ${changedEntitiesCount} Time-Series","groupByEntityIdColumn":true,"columnDefinitions":[{"dataAttribute":"tsName","type":"string","display":"Time-Series Name","isEntityId":true},{"dataAttribute":"attribute","type":"string","display":"Attribute"},{"dataAttribute":"currentValue","type":"string","display":"Current Value"},{"dataAttribute":"newValue","type":"string","display":"New Value"}],"sortOrdering":{"dataAttribute":"tsName","direction":"ASC"},"rowThreshold":50,"overflowMessage":"Too many time-series meta-data changes to display inline. Please use the external link to view all changes."},{"dataTypeId":"riskFactorMetaData","dataTypeTitle":"Risk Factor Meta-Data","headerSummaryTextTemplate":"${changedValuesCount} Risk Factor Meta-Data attribute have been changed for ${changedEntitiesCount} Risk Factors","groupByEntityIdColumn":true,"columnDefinitions":[{"dataAttribute":"rfName","type":"string","display":"Risk Factor Name","isEntityId":true},{"dataAttribute":"attribute","type":"string","display":"Attribute"},{"dataAttribute":"currentValue","type":"string","display":"Current Value"},{"dataAttribute":"newValue","type":"string","display":"New Value"}],"sortOrdering":{"dataAttribute":"rfName","direction":"ASC"},"rowThreshold":50,"overflowMessage":"Too many risk factor meta-data changes to display inline. Please use the external link to view all changes."},{"dataTypeId":"mappingChanges","dataTypeTitle":"Mapping Changes","headerSummaryTextTemplate":"${changedValuesCount} Mapping Changes","columnDefinitions":[{"dataAttribute":"riskFactor","type":"string","display":"Risk Factor","isEntityId":true},{"dataAttribute":"currentMappedTs","type":"string","display":"Current Mapped Time-Series"},{"dataAttribute":"newMappedTs","type":"string","display":"New Mapped Time-Series"}],"sortOrdering":{"dataAttribute":"riskFactor","direction":"ASC"}},{"dataTypeId":"formulaChanges","dataTypeTitle":"Formula Changes","headerSummaryTextTemplate":"${changedValuesCount} Formula Changes","columnDefinitions":[{"dataAttribute":"formulaTsName","type":"string","display":"Formulaic Time-series Name","isEntityId":true},{"dataAttribute":"currentFormula","type":"string","display":"Current Formula"},{"dataAttribute":"newFormula","type":"string","display":"New Formula"}],"sortOrdering":{"dataAttribute":"formulaTsName","direction":"ASC"}}]}',
                  version = 4,
                  updated_at = NOW()
              WHERE id = 'cccccccc-cccc-4ccc-8ccc-ccccccccc003';
