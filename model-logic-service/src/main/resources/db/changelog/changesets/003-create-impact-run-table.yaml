databaseChangeLog:
  - changeSet:
      id: 003-create-impact-run-table
      author: scenarios-team
      changes:
        - createTable:
            tableName: impact_run
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: scenario_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_impact_run_scenario
                    references: scenario(id)
              - column:
                  name: run_ref
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: timestamp
