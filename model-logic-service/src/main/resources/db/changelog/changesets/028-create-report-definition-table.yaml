databaseChangeLog:
  - property:
      name: jsonColumnType
      value: JSONB
      dbms: postgresql
  - property:
      name: jsonColumnType
      value: CLOB

  - changeSet:
      id: 028-create-report-definition-table
      author: scenarios-team
      changes:
        - createTable:
            tableName: report_definition
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: scenario_type_code
                  type: varchar(50)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_report_def_scenario_type
                    references: scenario_type(code)
              - column:
                  name: report_key
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: definition
                  type: ${jsonColumnType}
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 028-add-unique-constraint-report-def
      author: scenarios-team
      changes:
        - addUniqueConstraint:
            tableName: report_definition
            columnNames: scenario_type_code, report_key, version
            constraintName: uq_report_def_type_key_version

  - changeSet:
      id: 028-create-report-def-lookup-index
      author: scenarios-team
      changes:
        - createIndex:
            indexName: idx_report_def_lookup
            tableName: report_definition
            columns:
              - column:
                  name: scenario_type_code
              - column:
                  name: report_key
              - column:
                  name: is_active

  - changeSet:
      id: 028-create-report-def-gin-index
      author: scenarios-team
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: postgresql
      changes:
        - sql:
            sql: |
              CREATE INDEX idx_report_def_definition_gin
                ON report_definition USING GIN (definition);
