databaseChangeLog:
  - changeSet:
      id: 015-add-owner-user-id-to-scenario
      author: scenarios-team
      changes:
        - addColumn:
            tableName: scenario
            columns:
              - column:
                  name: owner_user_id
                  type: varchar(100)
                  constraints:
                    nullable: true
                    foreignKeyName: fk_scenario_owner_user_ref
                    references: user_ref(id)
  - changeSet:
      id: 015-add-author-user-id-to-message
      author: scenarios-team
      changes:
        - addColumn:
            tableName: scenario_message
            columns:
              - column:
                  name: author_user_id
                  type: varchar(100)
                  constraints:
                    nullable: true
                    foreignKeyName: fk_message_author_user_ref
                    references: user_ref(id)
  - changeSet:
      id: 015-add-actor-user-id-to-event
      author: scenarios-team
      changes:
        - addColumn:
            tableName: scenario_event
            columns:
              - column:
                  name: actor_user_id
                  type: varchar(100)
                  constraints:
                    nullable: true
                    foreignKeyName: fk_event_actor_user_ref
                    references: user_ref(id)
  - changeSet:
      id: 015-add-participant-user-ref-fk
      author: scenarios-team
      changes:
        - addForeignKeyConstraint:
            baseTableName: scenario_participant
            baseColumnNames: user_id
            referencedTableName: user_ref
            referencedColumnNames: id
            constraintName: fk_participant_user_ref
  - changeSet:
      id: 015-backfill-user-ref-fks
      author: scenarios-team
      changes:
        - sql:
            sql: |
              -- Backfill scenario.owner_user_id from owner_display_name
              UPDATE scenario SET owner_user_id = 'owner-1' WHERE owner_display_name = 'Alice Johnson';
              UPDATE scenario SET owner_user_id = 'owner-3' WHERE owner_display_name = 'Bob Smith';
              UPDATE scenario SET owner_user_id = 'owner-2' WHERE owner_display_name = 'Carol Davis';

              -- Backfill scenario_event.actor_user_id from actor_display_name
              UPDATE scenario_event SET actor_user_id = 'approver-1' WHERE actor_display_name = 'Jane Smith';
              UPDATE scenario_event SET actor_user_id = 'approver-2' WHERE actor_display_name = 'John Doe';
              UPDATE scenario_event SET actor_user_id = 'owner-3' WHERE actor_display_name = 'Bob Smith';
              UPDATE scenario_event SET actor_user_id = 'owner-2' WHERE actor_display_name = 'Carol Davis';
              UPDATE scenario_event SET actor_user_id = 'system' WHERE actor_display_name = 'System';
              UPDATE scenario_event SET actor_user_id = 'approver-3' WHERE actor_display_name = 'Bob Williams';

              -- Backfill scenario_message.author_user_id from author_display_name
              UPDATE scenario_message SET author_user_id = 'approver-1' WHERE author_display_name = 'Jane Smith';
              UPDATE scenario_message SET author_user_id = 'approver-2' WHERE author_display_name = 'John Doe';
              UPDATE scenario_message SET author_user_id = 'owner-3' WHERE author_display_name = 'Bob Smith';
              UPDATE scenario_message SET author_user_id = 'owner-2' WHERE author_display_name = 'Carol Davis';
              UPDATE scenario_message SET author_user_id = 'system' WHERE author_display_name = 'System';
              UPDATE scenario_message SET author_user_id = 'approver-3' WHERE author_display_name = 'Bob Williams';
